version: '3.8'

services:
  # Ephemeral In-Memory Redis Store (Strictly Zero-Persistence)
  redis:
    image: redis:7.2-alpine
    container_name: portelx-ephemeral-redis
    command: redis-server --save "" --appendonly no --maxmemory 256mb --maxmemory-policy volatile-ttl
    ports:
      - "6379:6379"
    restart: unless-stopped

  # PortelX Asynchronous Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: portelx-backend
    environment:
      - ENVIRONMENT=development
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "8000:8000"
    depends_on:
      - redis
    restart: unless-stopped
