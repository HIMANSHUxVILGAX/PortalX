<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PortelX</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #000000; color: #ffffff; -webkit-tap-highlight-color: transparent; }
        .glass-card { background: #111111; border: 1px solid #222222; border-radius: 24px; }
    </style>
</head>
<body class="flex flex-col min-h-screen">

<main class="flex-1 flex flex-col items-center justify-center px-6 relative">
    <div class="absolute top-12 left-6">
        <span class="text-sm font-semibold tracking-wider text-gray-500 uppercase">PortelX</span>
    </div>
    
    <div class="mb-16 flex flex-col items-center">
        <div class="w-24 h-24 bg-gray-900 rounded-full flex items-center justify-center mb-8 shadow-[0_0_50px_rgba(59,130,246,0.15)]">
            <span class="material-symbols-outlined text-5xl text-blue-500">lock</span>
        </div>
        <h1 class="text-3xl font-semibold tracking-tight text-center">Protected<br>by PortelX</h1>
    </div>
    
    <div class="w-full max-w-sm mt-4">
        <button onclick="document.getElementById('loading').classList.remove('hidden'); setTimeout(() => window.location.href='/role', 800)" class="w-full bg-white text-black py-4 rounded-full font-semibold text-lg flex items-center justify-center gap-2 hover:bg-gray-200 transition-colors active:scale-95">
            <span class="material-symbols-outlined">fingerprint</span>
            Unlock
        </button>
        <p id="loading" class="text-gray-500 text-center mt-6 text-sm hidden animate-pulse">Verifying Identity...</p>
    </div>
</main>

</body>
</html>
