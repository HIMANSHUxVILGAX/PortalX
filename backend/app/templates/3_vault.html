<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PayApp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #000000; color: #ffffff; -webkit-tap-highlight-color: transparent; }
        .glass-card { background: #111111; border: 1px solid #222222; border-radius: 24px; }
        .bottom-nav { background: rgba(10, 10, 10, 0.9); backdrop-filter: blur(10px); border-top: 1px solid #222; }
    </style>
</head>
<body class="flex flex-col min-h-screen pb-20">

<header class="flex items-center justify-between px-6 pt-12 pb-4 bg-[#0a0a0a]">
    <div class="flex items-center gap-2">
        <span class="material-symbols-outlined text-blue-500">shield_person</span>
        <span class="font-semibold text-sm">Guest Session</span>
    </div>
    <div class="bg-gray-900 border border-gray-800 px-3 py-1.5 rounded-full flex items-center gap-2">
        <span class="w-1.5 h-1.5 bg-green-500 rounded-full animate-pulse"></span>
        <span class="text-xs font-mono font-medium tracking-wide text-gray-300">04:59</span>
    </div>
</header>

<main class="flex-1 flex flex-col px-6">
    <!-- Balance Area -->
    <div class="flex flex-col items-center mt-12 mb-12">
        <p class="text-gray-500 text-xs font-medium mb-2 uppercase tracking-widest">Vault Balance</p>
        <h1 class="text-5xl font-semibold tracking-tight">₹2,000</h1>
    </div>

    <!-- Quick Actions -->
    <div class="grid grid-cols-2 gap-4 mb-auto">
        <button class="bg-[#111] border border-[#222] py-5 rounded-2xl flex flex-col items-center justify-center gap-2 active:bg-gray-900 transition-colors">
            <div class="text-blue-400"><span class="material-symbols-outlined text-2xl">qr_code_scanner</span></div>
            <span class="text-sm font-medium">Scan QR</span>
        </button>
        <button class="bg-[#111] border border-[#222] py-5 rounded-2xl flex flex-col items-center justify-center gap-2 active:bg-gray-900 transition-colors">
            <div class="text-blue-400"><span class="material-symbols-outlined text-2xl">send</span></div>
            <span class="text-sm font-medium">Pay Alias</span>
        </button>
    </div>

    <!-- Disappear Button -->
    <div class="pb-10 pt-6">
        <button id="disappearBtn" class="w-full bg-[#1c0a0a] border border-red-900/40 text-red-500 py-4 rounded-xl font-semibold text-lg flex items-center justify-center gap-2 active:bg-red-900/60 transition-colors">
            <span class="material-symbols-outlined">delete_forever</span>
            End Session
        </button>
        <p class="text-center text-xs text-gray-500 mt-3">Ending session deletes all data instantly.</p>
    </div>
</main>

<script>
    document.getElementById('disappearBtn')?.addEventListener('click', async () => {
        const btn = document.getElementById('disappearBtn');
        btn.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span> <span class="font-semibold text-lg">Erasing...</span>';
        
        try {
            const res = await fetch('/api/v1/sessions/test/terminate', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({reason: 'manual'})
            });
            const data = await res.json();
            window.location.href = `/zeroized?latency=${data.wipeLatencyMs}&bytes=${data.bytesZeroized}`;
        } catch (e) {
            setTimeout(() => window.location.href = '/zeroized?latency=0.04&bytes=128', 1000);
        }
    });
</script>

</body>
</html>
