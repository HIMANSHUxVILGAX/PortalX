<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PayApp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #000000; color: #ffffff; -webkit-tap-highlight-color: transparent; }
        .glass-card { background: #111111; border: 1px solid #222222; border-radius: 24px; }
        .bottom-nav { background: rgba(10, 10, 10, 0.9); backdrop-filter: blur(10px); border-top: 1px solid #222; }
    </style>
</head>
<body class="flex flex-col min-h-screen pb-20">

<header class="pt-16 pb-8 px-6 flex items-center justify-between">
    <h1 class="text-2xl font-semibold tracking-tight">Select Session Mode</h1>
    <button onclick="window.location.href='/profile'" class="text-gray-400 text-sm font-medium">Cancel</button>
</header>
<main class="flex-1 px-6 flex flex-col gap-4">
    <!-- Guest Vault Card -->
    <button onclick="window.location.href='/vault'" class="bg-[#111] border border-[#222] p-5 flex items-center justify-between rounded-2xl w-full active:scale-95 transition-transform hover:border-blue-500">
        <div class="flex items-center gap-4">
            <div class="w-12 h-12 bg-blue-500/10 text-blue-500 rounded-full flex items-center justify-center">
                <span class="material-symbols-outlined text-2xl">account_balance_wallet</span>
            </div>
            <div class="text-left">
                <h2 class="text-lg font-semibold mb-0.5">Guest Vault</h2>
                <p class="text-gray-400 text-xs">Access a secure temporary wallet.</p>
            </div>
        </div>
        <span class="material-symbols-outlined text-gray-500">chevron_right</span>
    </button>

    <!-- Lend Device Card -->
    <button class="bg-[#111] border border-[#222] p-5 flex items-center justify-between rounded-2xl w-full active:scale-95 transition-transform hover:border-gray-500">
        <div class="flex items-center gap-4">
            <div class="w-12 h-12 bg-gray-800 text-gray-300 rounded-full flex items-center justify-center">
                <span class="material-symbols-outlined text-2xl">smartphone</span>
            </div>
            <div class="text-left">
                <h2 class="text-lg font-semibold mb-0.5">Lend Device</h2>
                <p class="text-gray-400 text-xs">Give phone to a stranger safely.</p>
            </div>
        </div>
        <span class="material-symbols-outlined text-gray-500">chevron_right</span>
    </button>
</main>

</body>
</html>
