<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PayApp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #000000; color: #ffffff; -webkit-tap-highlight-color: transparent; }
        .glass-card { background: #111111; border: 1px solid #222222; border-radius: 24px; }
        .bottom-nav { background: rgba(10, 10, 10, 0.9); backdrop-filter: blur(10px); border-top: 1px solid #222; }
    </style>
</head>
<body class="flex flex-col min-h-screen pb-20">

<main class="flex-1 flex flex-col items-center justify-center px-6">
    <div class="flex flex-col items-center mb-10 text-center">
        <div class="w-20 h-20 bg-green-500/10 text-green-500 rounded-full flex items-center justify-center mb-6 shadow-[0_0_50px_rgba(34,197,94,0.15)]">
            <span class="material-symbols-outlined text-4xl">check_circle</span>
        </div>
        <h1 class="text-2xl font-semibold mb-2 tracking-tight">Session Ended</h1>
        <p class="text-gray-400 text-sm max-w-[250px] leading-relaxed">Temporary data has been erased. Returning to primary account.</p>
    </div>
    
    <div class="bg-[#111] border border-[#222] rounded-xl p-4 mb-12 w-full max-w-sm flex flex-col gap-2">
        <div class="flex justify-between items-center border-b border-[#222] pb-2">
            <span class="text-gray-400 text-xs font-medium">Memory Wipe Latency</span>
            <span id="latencyVal" class="font-mono text-xs font-medium text-green-400">0.00ms</span>
        </div>
        <div class="flex justify-between items-center pt-1">
            <span class="text-gray-400 text-xs font-medium">Bytes Zeroized</span>
            <span id="bytesVal" class="font-mono text-xs font-medium text-green-400">0 B</span>
        </div>
    </div>

    <div class="w-full max-w-sm">
        <button onclick="window.location.href='/'" class="w-full bg-blue-600 text-white py-4 rounded-xl font-semibold text-base hover:bg-blue-700 transition-colors active:scale-95">
            Back to Home
        </button>
    </div>
</main>

<script>
    const params = new URLSearchParams(window.location.search);
    if(params.get('latency')) {
        document.getElementById('latencyVal').innerText = params.get('latency') + ' ms';
    }
    if(params.get('bytes')) {
        document.getElementById('bytesVal').innerText = params.get('bytes') + ' B';
    }
</script>

</body>
</html>
