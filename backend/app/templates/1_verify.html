<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PayApp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #000000; color: #ffffff; -webkit-tap-highlight-color: transparent; }
        .glass-card { background: #111111; border: 1px solid #222222; border-radius: 24px; }
        .bottom-nav { background: rgba(10, 10, 10, 0.9); backdrop-filter: blur(10px); border-top: 1px solid #222; }
    </style>
</head>
<body class="flex flex-col min-h-screen pb-20">

<main class="flex-1 flex flex-col items-center justify-center px-6 relative h-screen">
    <div class="absolute top-12 left-4">
        <button onclick="window.history.back()" class="w-10 h-10 flex items-center justify-center rounded-full bg-[#111] text-gray-400">
            <span class="material-symbols-outlined">arrow_back</span>
        </button>
    </div>
    
    <div class="mb-16 flex flex-col items-center">
        <div class="w-24 h-24 bg-[#111] rounded-full flex items-center justify-center mb-8 shadow-[0_0_50px_rgba(59,130,246,0.15)]">
            <span class="material-symbols-outlined text-5xl text-blue-500">fingerprint</span>
        </div>
        <h1 class="text-2xl font-semibold tracking-tight text-center">Unlock PortelX</h1>
        <p class="text-gray-400 text-sm mt-2 text-center">Verify host identity to continue.</p>
    </div>
    
    <div class="w-full max-w-sm mt-4">
        <button onclick="document.getElementById('loading').classList.remove('hidden'); setTimeout(() => window.location.href='/role', 1000)" class="w-full bg-blue-600 text-white py-4 rounded-xl font-semibold text-lg flex items-center justify-center gap-2 hover:bg-blue-700 transition-colors active:scale-95">
            Use Biometrics
        </button>
        <p id="loading" class="text-blue-400 text-center mt-6 text-sm hidden animate-pulse">Authenticating Enclave...</p>
    </div>
</main>

</body>
</html>
